[workspace]
resolver = "3"
members = [
    "shared-embedded",
    "stm32h7-nucleo-embassy",
    "stm32h7-nucleo-rtic",
]

[workspace.dependencies]
types = { path = "../types", features = ["defmt"] }
minisim-types = { path = "../minisim-types", features = ["defmt"] }
shared-embedded = { path = "shared-embedded" }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
arbitrary-int = "2"
# ip_in_core adds formatting for the core::net types.
defmt = { version = "1", features = ["ip_in_core"] }
defmt-rtt = "1"
defmt-test = "0.5"
panic-probe = { version = "1", features = ["print-defmt"] }
# Contains the TLSF usage API fixes, which are not released yet. Switch back to crates.io
# once v0.7.1 is out.
embedded-alloc = { git = "https://github.com/rust-embedded/embedded-alloc", rev = "3e687e5855cdc98e8c984574a75d44732433b9db" }
static_cell = "2"
spacepackets = { version = "0.19", default-features = false, features = ["defmt"] }
postcard = { version = "1", features = ["use-defmt"] }
serde = { version = "1", default-features = false }
rtic = { version = "2", features = ["thumbv7-backend"] }

embassy-stm32 = { version = "0.6", features = ["stm32h753zi", "defmt"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = "0.5"
embassy-net = { version = "0.9", features = ["medium-ethernet", "proto-ipv4", "tcp", "udp", "auto-icmp-echo-reply", "dhcpv4", "defmt"] }
embassy-sync = "0.8"
embassy-futures = "0.1"

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 's'         # <-
overflow-checks = true  # <-

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3           # <-
overflow-checks = true  # <-

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3            # <-
overflow-checks = false  # <-

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3            # <-
overflow-checks = false  # <-
