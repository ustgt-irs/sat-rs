[package]
name = "types"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
spacepackets = { version = "0.18", default-features = false, features = ["serde"] }
satrs = { path = "../../satrs", default-features = false, features = ["serde"] }
num_enum = { version = "0.7", default-features = false }
strum = { version = "0.28", default-features = false, features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = { version = "2", default-features = false }
bitbybit = "2"
arbitrary-int = "2"
heapless = { version = "0.9", features = ["serde"] }
