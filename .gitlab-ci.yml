variables:
  # GitLab can only cache paths inside the project directory.
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

default:
  image: rust:latest
  cache:
    key: ${CI_JOB_NAME_SLUG}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/

# Required by the serialport crate.
.udev:
  before_script:
    - apt-get update && apt-get install -y libudev-dev

check:
  extends: .udev
  script:
    - cargo check
    # Check example with static pool configuration
    - cargo check -p example-std --no-default-features

test:
  extends: .udev
  script:
    # The cargo bin folder of the image is in the PATH.
    - curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C /usr/local/cargo/bin
    - cargo nextest run --all-features
    - cargo test --doc --all-features

cross-check:
  parallel:
    matrix:
      - TARGET: [armv7-unknown-linux-gnueabihf, thumbv7em-none-eabihf]
  script:
    - rustup target add $TARGET
    - cargo check -p satrs --target=$TARGET --no-default-features

fmt:
  cache: []
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

docs:
  script:
    # rustup can only install toolchains with the CARGO_HOME it was installed to.
    - CARGO_HOME=/usr/local/cargo rustup toolchain install nightly --profile minimal
    - RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc -p satrs --all-features --no-deps

clippy:
  extends: .udev
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings

# The embedded examples are a separate workspace.
embedded:
  cache:
    key: ${CI_JOB_NAME_SLUG}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - examples/embedded/target/
  script:
    - rustup component add clippy rustfmt
    - rustup target add thumbv7em-none-eabihf
    # Linker of the embedded examples. Installed to a folder in the PATH.
    - cargo install flip-link --locked --root /usr/local/cargo
    - cd examples/embedded
    - cargo fmt --all -- --check
    - cargo clippy -- -D warnings
    - cargo build --release
